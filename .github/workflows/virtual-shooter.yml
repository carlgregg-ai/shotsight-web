name: ShotSight virtual shooter

on:
  push:
    branches: [virtual-shooter-v1]
    paths:
      - 'learning/**'
      - 'tests/virtual-shooter-*.mjs'
      - 'docs/learning/**'
      - '.github/workflows/virtual-shooter.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  containment-and-baselines:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run L0 oracle/shooter information-boundary tests
        run: node tests/virtual-shooter-boundary-v1.mjs
      - name: Run L0 oracle ceiling and naive shooter baseline tests
        run: node tests/virtual-shooter-baselines-v1.mjs
      - name: Run L1 perception-only stable crosser belief tests
        run: node tests/virtual-shooter-perception-v1.mjs
      - name: Run L1 held-out uncertainty calibration tests
        run: node tests/virtual-shooter-perception-calibration-v1.mjs
      - name: Run L1 held-out mixed-family ambiguity tests
        run: node tests/virtual-shooter-multifamily-v1.mjs
      - name: Run L1 calibrated selective-wait decision tests
        run: node tests/virtual-shooter-selective-wait-v1.mjs
