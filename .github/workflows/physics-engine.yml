name: ShotSight physics engine

on:
  push:
    branches: [physics-engine-v1]
    paths:
      - 'physics/**'
      - 'tests/physics-*.mjs'
      - 'tests/p7-rendered-review.mjs'
      - 'tests/p8-quarterer-rendered-review.mjs'
      - 'tests/p8-looper-rendered-review.mjs'
      - 'tests/p8-teal-rendered-review.mjs'
      - 'docs/physics/**'
      - 'docs/reviewer-animation/**'
      - 'p7-debug.html'
      - 'p8-quarterer-debug.html'
      - 'p8-looper-debug.html'
      - 'p8-teal-debug.html'
      - 'reviewer-flat-crosser.html'
      - 'reviewer-flat-crosser.js'
      - '.github/workflows/physics-engine.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  target-physics-v1:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run P3 target physics analytic tests
        run: node tests/physics-target-v1.mjs
      - name: Run P4 ballistic/intercept analytic tests
        run: node tests/physics-ballistics-v1.mjs
      - name: Run P4 Allen closed-form TOF validation
        run: node tests/physics-allen-tof-derived-v1.mjs
      - name: Run P4 provider-based TOF intercept validation
        run: node tests/physics-ballistic-intercept-tof-v1.mjs
      - name: Run explicit-target-trajectory intercept validation
        run: node tests/physics-ballistic-intercept-trajectory-v1.mjs
      - name: Run P5 projection and gun kinematics validation
        run: node tests/physics-projection-gun-v1.mjs
      - name: Run P6 method and narrative fail-closed validation
        run: node tests/physics-method-narrative-v1.mjs
      - name: Run P6 source-attributed method registry validation
        run: node tests/physics-method-registry-v1.mjs
      - name: Run P7 flat-crosser integrated engineering proof
        run: node tests/physics-canonical-flat-crosser-v1.mjs
      - name: Run P7 browser debug contract validation
        run: node tests/physics-p7-browser-debug-v1.mjs
      - name: Run P7 rendered adversarial review
        run: node tests/p7-rendered-review.mjs
      - name: Upload P7 rendered review artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p7-rendered-review
          path: artifacts/p7-rendered-review/
          if-no-files-found: warn
      - name: Run 3D maths-driven flat-crosser reviewer contract
        run: node tests/physics-reviewer-flat-crosser-v1.mjs
      - name: Export model-driven flat-crosser reviewer frame manifest
        run: node tools/export-reviewer-flat-crosser.mjs
      - name: Upload flat-crosser reviewer manifest
        uses: actions/upload-artifact@v4
        with:
          name: reviewer-flat-crosser-model-frames
          path: artifacts/reviewer-flat-crosser/
          if-no-files-found: error
      - name: Run three-method reviewer hypothesis contract
        run: node tests/physics-reviewer-method-comparison-v1.mjs
      - name: Export three-method reviewer manifests
        run: node tools/export-reviewer-method-comparison.mjs
      - name: Upload three-method reviewer manifests
        uses: actions/upload-artifact@v4
        with:
          name: reviewer-method-comparison-model-frames
          path: artifacts/reviewer-method-comparison/
          if-no-files-found: error
      - name: Run P8A quarterer engineering proof
        run: node tests/physics-canonical-quarterer-v1.mjs
      - name: Run P8A quarterer browser debug contract
        run: node tests/physics-p8-quarterer-browser-debug-v1.mjs
      - name: Run P8A quarterer rendered adversarial review
        run: node tests/p8-quarterer-rendered-review.mjs
      - name: Upload P8A quarterer rendered review artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p8-quarterer-rendered-review
          path: artifacts/p8-quarterer-rendered-review/
          if-no-files-found: warn
      - name: Run P8B gravity-only looper engineering proof
        run: node tests/physics-canonical-looper-gravity-v1.mjs
      - name: Run P8B looper browser debug contract
        run: node tests/physics-p8-looper-browser-debug-v1.mjs
      - name: Run P8B looper rendered adversarial review
        run: node tests/p8-looper-rendered-review.mjs
      - name: Upload P8B looper rendered review artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p8-looper-rendered-review
          path: artifacts/p8-looper-rendered-review/
          if-no-files-found: warn
      - name: Run P8C teal gravity-only engineering proof
        run: node tests/physics-canonical-teal-gravity-v1.mjs
      - name: Run P8C teal browser debug contract
        run: node tests/physics-p8-teal-browser-debug-v1.mjs
      - name: Run P8C teal rendered adversarial review
        run: node tests/p8-teal-rendered-review.mjs
      - name: Upload P8C teal rendered review artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p8-teal-rendered-review
          path: artifacts/p8-teal-rendered-review/
          if-no-files-found: warn
      - name: Run P9A video observation/provenance recovery tests
        run: node tests/physics-video-observation-v1.mjs
      - name: Run P9B physics-constrained bearing-track fit tests
        run: node tests/physics-video-trajectory-fit-v1.mjs
      - name: Run P10 real-data calibration contract tests
        run: node tests/physics-real-data-calibration-v1.mjs
