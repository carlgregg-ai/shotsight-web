name: ShotSight virtual shooter

on:
  push:
    branches: [virtual-shooter-v1]
    paths:
      - 'learning/**'
      - 'tests/virtual-shooter-*.mjs'
      - 'docs/learning/**'
      - '.github/workflows/virtual-shooter.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  containment-and-baselines:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run L0 oracle/shooter information-boundary tests
        run: node tests/virtual-shooter-boundary-v1.mjs
      - name: Run L0 oracle ceiling and naive shooter baseline tests
        run: node tests/virtual-shooter-baselines-v1.mjs
      - name: Run L1 perception-only stable crosser belief tests
        run: node tests/virtual-shooter-perception-v1.mjs
      - name: Run L1 held-out uncertainty calibration tests
        run: node tests/virtual-shooter-perception-calibration-v1.mjs
      - name: Run L1 held-out mixed-family ambiguity tests
        run: node tests/virtual-shooter-multifamily-v1.mjs
      - name: Run L1 calibrated selective-wait decision tests
        run: node tests/virtual-shooter-selective-wait-v1.mjs
      - name: Run L2 perception-limited pickup/hold/connection/break planning tests
        run: node tests/virtual-shooter-shot-plan-v1.mjs
      - name: Run L2 held-out planning adaptation benchmark
        run: node tests/virtual-shooter-planning-evaluation-v1.mjs
      - name: Run L2 shooter-visible presentation context and runway tradeoff benchmark
        run: node tests/virtual-shooter-presentation-context-v1.mjs
      - name: Run L2 whole-presentation shot plan anchoring and consumed-runway tests
        run: node tests/virtual-shooter-presentation-shot-plan-v1.mjs
      - name: Run L2 held-out whole-presentation planning population gate
        run: node tests/virtual-shooter-presentation-shot-plan-heldout-v1.mjs
      - name: Run L3 finite gun/shooter plant constraint tests
        run: node tests/virtual-shooter-gun-plant-v1.mjs
      - name: Run L3 maintained-lead no-learning perception-to-shot baseline
        run: node tests/virtual-shooter-maintained-lead-baseline-v1.mjs
      - name: Run L3 maintained-lead hit-miss-only learning probe
        run: node tests/virtual-shooter-maintained-lead-learning-v1.mjs
      - name: Run L3 maintained-lead reward-support diagnosis
        run: node tests/virtual-shooter-maintained-lead-reward-support-v1.mjs
      - name: Run L3 dynamic perceptual-coupling reward-support diagnostic
        run: node tests/virtual-shooter-dynamic-perceptual-coupling-v1.mjs
      - name: Run L3 dynamic coupling geometry and time-alignment audit
        run: node tests/virtual-shooter-dynamic-coupling-geometry-v1.mjs
      - name: Run L3 shooter-visible dynamic trigger timing diagnostic
        run: node tests/virtual-shooter-dynamic-trigger-timing-v1.mjs
      - name: Run fresh post-audit L3 dynamic-coupling reward-support diagnostic
        id: fresh_coupling_reward
        run: node tests/virtual-shooter-dynamic-coupling-fresh-reward-v2.mjs
      - name: Fresh L3 diagnostic marker — binary reward support discovered
        if: steps.fresh_coupling_reward.outputs.reward_support == 'true'
        run: echo "Fresh non-sealed diagnostic found at least one post-trigger engineering-proxy hit."
      - name: Fresh L3 diagnostic marker — no binary reward support
        if: steps.fresh_coupling_reward.outputs.reward_support == 'false'
        run: echo "Fresh non-sealed diagnostic found zero engineering-proxy hits."
      - name: Run L3 quasi-continuous relationship exploration diagnostic
        id: continuous_relationship_reward
        run: node tests/virtual-shooter-continuous-relationship-reward-v1.mjs
      - name: Continuous relationship marker — binary reward support discovered
        if: steps.continuous_relationship_reward.outputs.reward_support == 'true'
        run: echo "Predeclared low-discrepancy shooter-visible relationship exploration found binary reward support."
      - name: Continuous relationship marker — no binary reward support
        if: steps.continuous_relationship_reward.outputs.reward_support == 'false'
        run: echo "Predeclared low-discrepancy shooter-visible relationship exploration found zero engineering-proxy hits."
      - name: Run L3 phase-dependent relationship trajectory diagnostic
        id: phase_relationship_reward
        run: node tests/virtual-shooter-phase-relationship-trajectory-v1.mjs
      - name: Phase relationship marker — binary reward support discovered
        if: steps.phase_relationship_reward.outputs.reward_support == 'true'
        run: echo "Predeclared shooter-visible phase-dependent relationship trajectories found binary reward support."
      - name: Phase relationship marker — no binary reward support
        if: steps.phase_relationship_reward.outputs.reward_support == 'false'
        run: echo "Predeclared shooter-visible phase-dependent relationship trajectories found zero engineering-proxy hits."
      - name: Run L3 Ellis apprenticeship record / Satisfaction anti-cheat gate
        run: node tests/virtual-shooter-ellis-experience-v1.mjs
      - name: Run L3 Ellis human-analogous visual acquisition gate
        run: node tests/virtual-shooter-human-vision-v1.mjs
      - name: Run L3 pull-away human-vision policy boundary gate
        run: node tests/virtual-shooter-pull-away-human-vision-policy-v1.mjs
